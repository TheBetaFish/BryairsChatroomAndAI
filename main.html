<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>
(function () {

  /* ========================================================
     CONFIG
     ======================================================== */

  const SUPABASE_URL =
    "";

  const SUPABASE_KEY =
    ";

  const HF_TOKEN =
    "";

  const MODEL_NAME =
    "Qwen/Qwen2.5-72B-Instruct";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ========================================================
     GLOBAL STATE
     ======================================================== */

  let currentUser = null;

  let currentProfile = null;

  let currentConversation = null;

  let conversations = [];

  let aiHistory = [];

  let chatrooms = [];

  let currentRoom = null;

  let realtimeChannel = null;


  /* ========================================================
     ELEMENTS
     ======================================================== */

  const login =
    document.getElementById(
      "bai-login"
    );

  const app =
    document.getElementById(
      "bai-app"
    );

  const usernameDisplay =
    document.getElementById(
      "bai-username"
    );

  const logoutButton =
    document.getElementById(
      "bai-logout"
    );


  /* ========================================================
     AUTH
     ======================================================== */

  async function getCurrentUser() {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getUser();

    if (error) {

      console.error(
        "Auth error:",
        error
      );

      return null;
    }

    return data.user;
  }


  async function loadProfile() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq(
          "id",
          currentUser.id
        )
        .single();

    if (error) {

      console.error(
        "Profile error:",
        error
      );

      return null;
    }

    return data;
  }


  /* ========================================================
     LOGIN
     ======================================================== */

  document
    .getElementById("bai-auth-login")
    .onclick =
      async function () {

        const email =
          document
            .getElementById(
              "bai-auth-email"
            )
            .value
            .trim();

        const password =
          document
            .getElementById(
              "bai-auth-password"
            )
            .value;

        const status =
          document.getElementById(
            "bai-login-status"
          );


        if (
          !email ||
          !password
        ) {

          status.textContent =
            "enter your email and password";

          return;
        }


        status.textContent =
          "signing in...";


        const {
          error
        } =
          await supabaseClient.auth
            .signInWithPassword({

              email:
                email,

              password:
                password

            });


        if (error) {

          status.textContent =
            error.message;

          return;
        }


        location.reload();

      };


  /* ========================================================
     SIGN UP
     ======================================================== */

  document
    .getElementById("bai-auth-signup")
    .onclick =
      async function () {

        const email =
          document
            .getElementById(
              "bai-auth-email"
            )
            .value
            .trim();

        const password =
          document
            .getElementById(
              "bai-auth-password"
            )
            .value;

        const username =
          document
            .getElementById(
              "bai-auth-username"
            )
            .value
            .trim();

        const status =
          document.getElementById(
            "bai-login-status"
          );


        if (
          !email ||
          !password ||
          !username
        ) {

          status.textContent =
            "enter email, password, and username";

          return;
        }


        if (
          username.length < 2
        ) {

          status.textContent =
            "username is too short";

          return;
        }


        status.textContent =
          "creating account...";


        const {
          data,
          error
        } =
          await supabaseClient.auth
            .signUp({

              email:
                email,

              password:
                password,

              options: {

                data: {

                  username:
                    username

                }

              }

            });


        if (error) {

          status.textContent =
            error.message;

          return;
        }


        if (!data.user) {

          status.textContent =
            "account creation failed";

          return;
        }


        if (data.session) {

          location.reload();

        } else {

          status.textContent =
            "account created — check your email";

        }

      };


  /* ========================================================
     LOGOUT
     ======================================================== */

  logoutButton.onclick =
    async function () {

      if (realtimeChannel) {

        await supabaseClient
          .removeChannel(
            realtimeChannel
          );

      }

      await supabaseClient.auth.signOut();

      location.reload();

    };


  /* ========================================================
     AI MODE
     ======================================================== */

  const aiMode =
    document.getElementById(
      "bai-ai-mode"
    );

  const roomMode =
    document.getElementById(
      "bai-chatroom-mode"
    );

  const aiButton =
    document.getElementById(
      "bai-ai-button"
    );

  const roomButton =
    document.getElementById(
      "bai-room-button"
    );


  function showAIMode() {

    aiMode.style.display =
      "flex";

    roomMode.style.display =
      "none";

    aiButton.classList.add(
      "active"
    );

    roomButton.classList.remove(
      "active"
    );

    document.getElementById("bai-section-label").textContent = "AI";
    document.getElementById("bai-account-area").classList.remove("chat-mode");

  }


  function showRoomMode() {

    aiMode.style.display =
      "none";

    roomMode.style.display =
      "flex";

    aiButton.classList.remove(
      "active"
    );

    roomButton.classList.add(
      "active"
    );

    document.getElementById("bai-section-label").textContent = "CHAT";
    document.getElementById("bai-account-area").classList.add("chat-mode");

  }


  aiButton.onclick =
    showAIMode;

  roomButton.onclick =
    async function () {

      showRoomMode();

      await refreshSocialData();

    };


  /* ========================================================
     AI CONVERSATIONS
     ======================================================== */

  const conversationsList =
    document.getElementById(
      "bai-conversations"
    );

  const newChatButton =
    document.getElementById(
      "bai-new-chat"
    );

  const aiLog =
    document.getElementById(
      "bai-ai-log"
    );

  const aiLogInner =
    document.getElementById(
      "bai-ai-log-inner"
    );

  const aiEmpty =
    document.getElementById(
      "bai-ai-empty"
    );

  const aiForm =
    document.getElementById(
      "bai-ai-form"
    );

  const aiInput =
    document.getElementById(
      "bai-ai-input"
    );

  const aiSend =
    document.getElementById(
      "bai-ai-send"
    );


  async function loadConversations() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("conversations")
        .select("*")
        .eq(
          "user_id",
          currentUser.id
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(
        "Conversations:",
        error
      );

      return [];
    }


    return data || [];
  }


  function renderConversations() {

    conversationsList.innerHTML =
      "";


    conversations.forEach(
      function (conversation) {

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "bai-conversation-item";


        const button =
          document.createElement(
            "button"
          );

        button.className =
          "bai-conversation";


        if (
          currentConversation &&
          conversation.id ===
          currentConversation.id
        ) {

          item.classList.add(
            "active"
          );

          button.classList.add(
            "active"
          );

        }


        button.textContent =
          conversation.title ||
          "New chat";

        button.title =
          conversation.title ||
          "New chat";


        button.onclick =
          async function () {

            await selectConversation(
              conversation
            );

          };


        const deleteButton =
          document.createElement(
            "button"
          );

        deleteButton.className =
          "bai-conversation-delete";

        deleteButton.type =
          "button";

        deleteButton.textContent =
          "×";

        deleteButton.title =
          "Delete conversation";

        deleteButton.setAttribute(
          "aria-label",
          "Delete conversation"
        );


        deleteButton.onclick =
          async function (event) {

            event.preventDefault();
            event.stopPropagation();

            await deleteConversation(
              conversation
            );

          };


        item.appendChild(button);
        item.appendChild(deleteButton);

        conversationsList.appendChild(item);

      }
    );
  }


  async function deleteConversation(conversation) {

    const title =
      conversation.title ||
      "New chat";

    const confirmed =
      confirm(
        'Delete "' + title + '"?\n\nThis will permanently delete the conversation and its messages.'
      );

    if (!confirmed) {
      return;
    }

    const wasCurrent =
      currentConversation &&
      currentConversation.id === conversation.id;

    const { error } =
      await supabaseClient
        .from("conversations")
        .delete()
        .eq("id", conversation.id)
        .eq("user_id", currentUser.id);

    if (error) {
      console.error("Delete conversation:", error);

      alert(
        "Could not delete conversation:\n" +
        error.message
      );

      return;
    }

    conversations =
      conversations.filter(
        function (item) {
          return item.id !== conversation.id;
        }
      );

    if (wasCurrent) {

      currentConversation = null;
      aiHistory = [];

      aiLogInner.innerHTML = "";
      aiEmpty.textContent =
        "no messages yet — say something below";
      aiEmpty.style.display = "block";

      if (conversations.length > 0) {
        await selectConversation(
          conversations[0]
        );
      } else {
        await createConversation();
      }

    } else {
      renderConversations();
    }
  }


  async function createConversation() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("conversations")
        .insert({

          user_id:
            currentUser.id,

          title:
            "New chat"

        })
        .select()
        .single();


    if (error) {

      console.error(error);

      alert(
        error.message
      );

      return null;
    }


    conversations.unshift(
      data
    );


    await selectConversation(
      data
    );


    return data;
  }


  async function selectConversation(
    conversation
  ) {

    currentConversation =
      conversation;

    aiHistory = [];


    aiLogInner.innerHTML =
      "";

    aiEmpty.style.display =
      "none";


    renderConversations();


    const {
      data,
      error
    } =
      await supabaseClient
        .from("messages")
        .select("*")
        .eq(
          "conversation_id",
          conversation.id
        )
        .order(
          "created_at",
          {
            ascending: true
          }
        );


    if (error) {

      console.error(error);

      aiEmpty.textContent =
        "error loading conversation";

      aiEmpty.style.display =
        "block";

      return;
    }


    data.forEach(
      function (message) {

        addAIRow(
          message.role,
          message.content
        );


        aiHistory.push({

          role:
            message.role,

          content:
            message.content

        });

      }

  async function updateAIConversationTitle(
    text
  ) {

    if (
      !currentConversation ||
      currentConversation.title !==
      "New chat"
    ) {

      return;
    }


    const title =
      text.length > 34
        ? text.substring(
            0,
            34
          ) + "..."
        : text;


    const {
      error
    } =
      await supabaseClient
        .from("conversations")
        .update({

          title:
            title

        })
        .eq(
          "id",
          currentConversation.id
        );


    if (error) {

      console.error(error);

      return;
    }


    currentConversation.title =
      title;


    const found =
      conversations.find(
        function (item) {

          return (
            item.id ===
            currentConversation.id
          );

        }
      );


    if (found) {

      found.title =
        title;

    }


    renderConversations();
  }

  async function createConversationWithUser(targetId) {
    let user1 = currentUser.id;
    let user2 = targetId;

    if (user1 > user2) [user1, user2] = [user2, user1];

    let { data, error } = await supabaseClient
      .from("dm_conversations")
      .select("*")
      .eq("user1_id", user1)
      .eq("user2_id", user2)
      .maybeSingle();

    if (!data && !error) {
      ({ data, error } = await supabaseClient
        .from("dm_conversations")
        .insert({ user1_id: user1, user2_id: user2 })
        .select()
        .single());
    }

    if (error?.code === "23505") {
      const result = await supabaseClient
        .from("dm_conversations")
        .select("*")
        .eq("user1_id", user1)
        .eq("user2_id", user2)
        .maybeSingle();
      data = result.data;
      error = result.error;
    }

    if (error || !data) {
      alert("Could not create private message:\n" + (error?.message || "Unknown error"));
      return null;
    }

    if (!dmConversations.some(dm => dm.id === data.id)) {
      dmConversations.unshift(data);
    }

    await renderDms();
    return data;
  }

  async function startRealtime() {
    if (!chatMode) return;

    if (realtimeChannel) {
      await supabaseClient.removeChannel(realtimeChannel);
      realtimeChannel = null;
    }

    const table = chatMode === "room" ? "chatroom_messages" : "dm_messages";
    const filter = chatMode === "room"
      ? "chatroom_id=eq." + currentRoom.id
      : "conversation_id=eq." + currentDM.id;

    realtimeChannel = supabaseClient
      .channel(
        "bai-" + chatMode + "-" +
        (chatMode === "room" ? currentRoom.id : currentDM.id) +
        "-" + currentUser.id
      )
      .on(
        "postgres_changes",
        { event: "INSERT", schema: "public", table, filter },
        async payload => {
          if (chatMode === "room" && currentRoom?.id !== payload.new.chatroom_id) return;
          if (chatMode === "dm" && currentDM?.id !== payload.new.conversation_id) return;
          await addRoomMessage(payload.new, chatMode);
        }
      )
      .on(
        "postgres_changes",
        { event: "DELETE", schema: "public", table, filter },
        payload => {
          const id = String(payload.old?.id ?? "");
          if (!id) return;

          const row = roomLogInner.querySelector(
            '.bai-room-message[data-message-type="' + chatMode + '"][data-message-id="' + id + '"]'
          );

          if (row) row.remove();
        }
      )
      .subscribe(status => {
        if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
          console.error("Realtime error:", status);
        }
      });
  }

    if (!currentRoom.is_private) {
      const continueInvite = confirm(
        "This is a public room. You can still invite the user, but they can already join it themselves. Continue?"
      );
      if (!continueInvite) return;
    }

    const { data, error } = await supabaseClient
      .from("profiles")
      .select("id, username")
      .eq("username", username.trim())
      .maybeSingle();

    if (error) {
      alert(error.message);
      return;
    }

    if (!data) {
      alert("No user found with that username.");
      return;
    }

    if (data.id === currentUser.id) {
      alert("You are already in this room.");
      return;
    }

    const { data: existingMember } = await supabaseClient
      .from("chatroom_members")
      .select("user_id")
      .eq("chatroom_id", currentRoom.id)
      .eq("user_id", data.id)
      .maybeSingle();

    if (existingMember) {
      alert("That user is already in the room.");
      return;
    }

    const { error: inviteError } = await supabaseClient
      .from("chatroom_invites")
      .insert({
        chatroom_id: currentRoom.id,
        inviter_id: currentUser.id,
        invitee_id: data.id
      });

    if (inviteError) {
      if (inviteError.code === "23505") {
        alert("That user already has an invitation for this room.");
      } else {
        alert("Could not send invitation:\n" + inviteError.message);
      }
      return;
    }

    alert("Invitation sent to @" + data.username);
  };

  /* ========================================================
     LEAVE / DELETE ROOM
     ======================================================== */

  roomLeaveButton.onclick = async () => {
    if (!currentRoom || chatMode !== "room") return;

    const isOwner = currentRoom.owner_id === currentUser.id;

    if (isOwner) {
      const confirmed = confirm(
        "You own this room.\n\nOK = permanently delete the room and all its messages\nCancel = stay"
      );

      if (!confirmed) return;

      const { error } = await supabaseClient
        .from("chatrooms")
        .delete()
        .eq("id", currentRoom.id)
        .eq("owner_id", currentUser.id);

      if (error) {
        alert("Could not delete room:\n" + error.message);
        return;
      }
    } else {
      const confirmed = confirm("Leave #" + currentRoom.name + "?");
      if (!confirmed) return;

      const { error } = await supabaseClient
        .from("chatroom_members")
        .delete()
        .eq("chatroom_id", currentRoom.id)
        .eq("user_id", currentUser.id);

      if (error) {
        alert("Could not leave room:\n" + error.message);
        return;
      }
    }

    currentRoom = null;
    chatMode = null;

    if (realtimeChannel) {
      await supabaseClient.removeChannel(realtimeChannel);
      realtimeChannel = null;
    }

    clearRoomView("room closed — choose another room or create one");
    await refreshSocialData();
  };

  async function refreshSocialData() {
    await loadChatrooms();
    await loadRoomInvites();
    await loadDms();
  }

  /* ========================================================
     INITIALIZE
     ======================================================== */

  async function initialize() {

    currentUser =
      await getCurrentUser();


    if (!currentUser) {

      login.style.display =
        "flex";

      app.style.display =
        "none";

      return;
    }


    currentProfile =
      await loadProfile();


    login.style.display =
      "none";

    app.style.display =
      "flex";


    usernameDisplay.textContent =
      "@" +
      (
        currentProfile?.username ||
        currentUser.email?.split("@")[0] ||
        "user"
      );


    conversations =
      await loadConversations();


    renderConversations();


    if (
      conversations.length ===
      0
    ) {

      await createConversation();

    } else {

      await selectConversation(
        conversations[0]
      );

    }


    /*
      Make sure there is a friends room.
    */

    await ensureFriendsRoom();


    /*
      Refresh room list so the newly
      created room appears.
    */

    await refreshSocialData();


    aiInput.focus();

  }


  /* ========================================================
     START
     ======================================================== */

  initialize().catch(
    function (error) {

      console.error(
        "Initialization:",
        error
      );

      document.getElementById(
        "bai-login-status"
      ).textContent =
        "startup error: " +
        error.message;

    }
  );

})();
</script>
